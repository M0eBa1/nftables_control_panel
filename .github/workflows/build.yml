name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux_amd64
          - goos: linux
            goarch: arm64
            suffix: linux_arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux_armv7
          - goos: linux
            goarch: 386
            suffix: linux_386
          - goos: linux
            goarch: mipsle
            suffix: linux_mipsle
          - goos: linux
            goarch: riscv64
            suffix: linux_riscv64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN_NAME="nftables_control_panel_${{ matrix.suffix }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "dist/${BIN_NAME}" .
          chmod +x "dist/${BIN_NAME}"
          cd dist
          tar -czvf "${BIN_NAME}.tar.gz" "${BIN_NAME}"
          sha256sum "${BIN_NAME}.tar.gz" > "${BIN_NAME}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Assets
        run: |
          mkdir -p release-files
          find release-artifacts/ -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
